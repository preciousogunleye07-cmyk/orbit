<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern for the background -->
    <pattern id="lightGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f0edf5" stroke-width="0.85"/>
    </pattern>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c094a"/>
      <stop offset="35%" stop-color="#3b0f60"/>
      <stop offset="65%" stop-color="#733299" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#c4a5dc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Official Orbit Logo Symbol Definition -->
    <g id="officialOrbitLogo">
      <g transform="matrix(1,0,0,1,-18792.089268,-12371.255635)">
        <g transform="matrix(1,0,0,1,-0.333333,0)">
          <g transform="matrix(2.129851,0,0,2.212134,9171.398506,9449.673764)">
            <g transform="matrix(1,0,0,1,4087.093215,610.990622)">
              <text x="595px" y="1484px" style="font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:466.279px;" fill="currentColor">
                oRbit
              </text>
            </g>
            <g>
              <g transform="matrix(3.661418,0,0,3.661418,3347.892978,40.964027)">
                <path d="M516.375,582.335C523.933,576.159 523.684,574.326 540.485,574.554C553.375,574.729 371.379,704.294 328.878,671.004C302.771,650.555 337.808,603.374 345.997,591.859C360.238,571.833 363.004,574.444 370.49,574.544C371.443,574.557 372.352,575.798 365.074,585.154C311.844,653.571 333.325,662.093 339.668,664.015C384.106,677.473 503.732,591.429 516.375,582.335Z" fill="currentColor" />
              </g>
              <g transform="matrix(3.661418,0,0,3.661418,3347.892978,40.964027)">
                <path d="M702.164,359.767C720.867,387.447 683.632,433.469 673.877,445.802C673.272,446.567 665.783,456.037 661.791,447.395C659.038,441.437 703.371,397.969 695.099,370.639C692.331,361.494 668.781,348.441 605.261,384.064C604.282,384.613 594.818,389.92 591.803,388.054C581.409,381.621 601.419,372.599 615.716,365.959C683.522,334.468 699.804,357.497 702.164,359.767Z" fill="currentColor" />
              </g>
              <g transform="matrix(3.661418,0,0,3.661418,3347.892978,40.964027)">
                <path d="M626.5,450.277C620.437,449.522 621.437,447.78 618.123,442.747C614.789,437.683 594.78,407.296 559.356,394.892C507.897,376.874 472.763,393.438 454.386,401.17C450.246,402.912 442.246,395.58 448.644,391.735C495.648,363.486 593.504,368.876 633.125,445.692C635.762,450.804 632.143,450.105 626.5,450.277Z" fill="currentColor" />
              </g>
              <g transform="matrix(3.661418,0,0,3.661418,3347.892978,40.964027)">
                <path d="M629.5,574.818C634.865,574.935 634.875,574.745 635.294,574.944C636.741,575.632 617.819,623.351 554.335,645.001C520.191,656.645 466.784,649.988 469.319,639.471C471.188,631.717 473.961,634.138 481.613,636.077C527.047,647.59 577.038,633.854 611.094,594.162C622.632,580.713 619.39,576.231 629.5,574.818Z" fill="currentColor" />
              </g>
              <g transform="matrix(3.661418,0,0,3.661418,3347.892978,40.964027)">
                <path d="M398.5,574.747C409.935,576.354 404.521,583.516 428.692,606.295C437.045,614.167 444.746,617.179 434.307,622.163C425.053,626.582 386.041,575.008 392.569,574.761C394.544,574.686 396.524,574.821 398.5,574.747Z" fill="currentColor" />
              </g>
            </g>
            <g>
              <g transform="matrix(3.808209,0.632315,-0.623474,3.754963,3918.461056,-621.954139)">
                <path d="M316.623,479.626C365.886,441.007 412.121,498.52 387.109,537.244C352.022,591.565 267.399,534.076 316.623,479.626Z" fill="currentColor" />
              </g>
              <g transform="matrix(2.914927,0.483995,-0.480632,2.894672,4146.003041,-116.119955)">
                <path d="M316.623,479.626C365.886,441.007 412.121,498.52 387.109,537.244C352.022,591.565 267.399,534.076 316.623,479.626Z" fill="currentColor" />
              </g>
              <g transform="matrix(0.461818,0,0,0.461818,4346.771659,786.181768)">
                <text x="1019px" y="1617px" style="font-family:Arial, Helvetica, sans-serif;font-size:205.219px;" fill="currentColor">
                  .edu
                </text>
              </g>
              <g transform="matrix(0.382161,0,0,0.382161,4414.710702,969.976294)">
                <text x="1019px" y="1617px" style="font-family:Arial, Helvetica, sans-serif;font-size:205.219px;" fill="currentColor">
                  .space
                </text>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </defs>

  <!-- Clean White Page Base -->
  <rect width="794" height="1123" fill="#ffffff"/>

  <!-- Subtle Engineering Grid across Document -->
  <rect x="0" y="80" width="794" height="980" fill="url(#lightGrid)"/>

  <!-- Official Orbit Space Background Watermark -->
  <g transform="translate(160, 360) scale(0.16) rotate(-12)" opacity="0.08" color="#6b2b93">
    <use href="#officialOrbitLogo" />
  </g>

  <!-- TOP HEADER SECTION -->
  <!-- Top decorative header banner bar -->
  <g transform="translate(34, 38)">
    <!-- Base container with gradient sweep -->
    <rect x="0" y="0" width="500" height="98" rx="28" fill="url(#headerGrad)"/>
    
    <!-- Left Logo Emblem Box -->
    <rect x="0" y="0" width="116" height="98" rx="28" fill="#290745"/>
    <rect x="88" y="0" width="28" height="98" fill="#290745"/>

    <!-- Official Orbit Logo Icon inside Header Emblem -->
    <g transform="translate(18, 14) scale(0.027)" color="#ffffff">
      <use href="#officialOrbitLogo" />
    </g>

    <!-- Brand Typography beside logo -->
    <g transform="translate(132, 28)">
      <text x="0" y="24" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="30" 
            font-weight="700" 
            letter-spacing="-0.5" 
            fill="#ffffff">Orbit space</text>
      <text x="1" y="45" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="13" 
            font-weight="400" 
            letter-spacing="0.4" 
            fill="#e7d8f5">Tech Academy &amp; Workspace</text>
    </g>
  </g>

  <!-- BOTTOM FOOTER SECTION -->
  <g transform="translate(0, 1063)">
    <!-- Solid Dark Purple Footer Band -->
    <rect x="0" y="0" width="794" height="60" fill="#2c084a"/>

    <!-- Footer Content (Email, Phone, Address with icons) -->
    <g transform="translate(24, 36)" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
      <!-- Email -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-weight="500" fill="#f5f0fb">orditspace.ilorin@gmail.com</text>
      </g>

      <!-- Phone -->
      <g transform="translate(230, 0)">
        <!-- Phone icon -->
        <circle cx="6" cy="-4" r="7" fill="#ffffff" fill-opacity="0.15"/>
        <path d="M 3 -7 C 2 -7, 1 -6, 2 -5 L 3 -3 C 3 -2, 4 -2, 5 -3 L 6 -4 C 7 -4, 8 -3, 9 -2 L 8 -1 C 8 0, 7 0, 6 0 C 4 0, 1 -3, 1 -5 C 1 -7, 3 -7, 3 -7 Z" fill="#ffffff"/>
        <text x="18" y="0" font-weight="500" fill="#f5f0fb">0703 880 6474, 0806 762 7491</text>
      </g>

      <!-- Address -->
      <g transform="translate(442, 0)">
        <!-- Pin icon -->
        <circle cx="5" cy="-4" r="7" fill="#ffffff" fill-opacity="0.15"/>
        <circle cx="5" cy="-5" r="2.2" fill="#ffffff"/>
        <text x="16" y="0" font-weight="400" fill="#f5f0fb">Behind Armour, Off Fate Tank, GRA, Ilorin, Kwara State</text>
      </g>
    </g>
  </g>
</svg>
