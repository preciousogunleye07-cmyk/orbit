<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111d" />
      <stop offset="50%" stop-color="#0d0b14" />
      <stop offset="100%" stop-color="#07060a" />
    </linearGradient>

    <!-- Glowing Purple Gradient -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a223d" stroke-width="0.75" opacity="0.3" />
    </pattern>

    <!-- Radial Glow filters -->
    <radialGradient id="glowBlob1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlob2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowBlob1)" />
  <rect width="1200" height="630" fill="url(#glowBlob2)" />

  <!-- Outer Decorative Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#2d2542" stroke-width="2" />

  <!-- Orbit Emblem Graphic on Right side -->
  <g transform="translate(850, 315)">
    <!-- Ambient Glow behind logo -->
    <circle cx="0" cy="0" r="180" fill="#a855f7" opacity="0.08" />
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="190" ry="65" fill="none" stroke="url(#purpleGlow)" stroke-width="4" transform="rotate(-30)" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="230" ry="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 8" transform="rotate(20)" opacity="0.4" />
    <!-- Core Sphere -->
    <circle cx="0" cy="0" r="48" fill="#1b1726" stroke="url(#purpleGlow)" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="url(#purpleGlow)" />
    <circle cx="-8" cy="-8" r="8" fill="#ffffff" opacity="0.7" />
    <!-- Satellite Dots -->
    <circle cx="140" cy="-70" r="10" fill="#38bdf8" />
    <circle cx="-160" cy="60" r="8" fill="#e879f9" />
  </g>

  <!-- Badge Tag -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="340" height="38" rx="19" fill="#1e192e" stroke="#3d3356" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#a855f7" />
    <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#c084fc" letter-spacing="0.5">PRACTICAL TECH ACADEMY &amp; WORKSPACE</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="230" font-family="'Noto Serif', Georgia, serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="-1">
    Orbit Space
  </text>
  <text x="100" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="url(#purpleGlow)" letter-spacing="-0.5">
    Ilorin, Nigeria
  </text>

  <!-- Description -->
  <text x="100" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Hands-on Tech Training • SIWES Industrial Placements • High-Speed Workspace
  </text>

  <!-- Divider Line -->
  <line x1="100" y1="425" x2="680" y2="425" stroke="#2e2645" stroke-width="1.5" />

  <!-- Feature Chips / Badges at bottom left -->
  <g transform="translate(100, 460)">
    <!-- Chip 1: Software & Web -->
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#181524" stroke="#332d47" stroke-width="1" />
    <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">💻 Software Eng.</text>

    <!-- Chip 2: Cybersecurity -->
    <rect x="180" y="0" width="165" height="42" rx="10" fill="#181524" stroke="#332d47" stroke-width="1" />
    <text x="198" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">🛡️ Cybersecurity</text>

    <!-- Chip 3: Data & AI -->
    <rect x="360" y="0" width="140" height="42" rx="10" fill="#181524" stroke="#332d47" stroke-width="1" />
    <text x="378" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">📊 Data &amp; AI</text>

    <!-- Chip 4: SIWES -->
    <rect x="515" y="0" width="165" height="42" rx="10" fill="#181524" stroke="#332d47" stroke-width="1" />
    <text x="533" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0">⚡ SIWES Hub</text>
  </g>

  <!-- Website URL Footer -->
  <text x="100" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#c084fc" letter-spacing="1">
    orbitspace.academia
  </text>
</svg>
